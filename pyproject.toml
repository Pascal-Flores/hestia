[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hestia-voice"
version = "0.1.0"
description = "Extensible local-first voice assistant with semantic routing and manifest-driven tools"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.18,<5", "num2words>=0.5.13,<0.6"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
embeddings-onnx = ["fastembed>=0.6,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "httpx>=0.27,<1"]
voice = ["faster-whisper>=1.0,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
hestia = "hestia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
