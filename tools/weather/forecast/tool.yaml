id: weather.forecast
name: Prévisions météo
description: Consulte les prévisions quotidiennes d'Open-Meteo pour une ville.
routing:
  examples:
    - Quel temps fera-t-il demain ?
    - Est-ce qu'il va pleuvoir ce weekend ?
    - Prévisions météo pour les prochains jours
    - Quelle température est prévue lundi à Lyon ?
    - Donne-moi la météo de la semaine à Paris
inputs:
  type: object
  additionalProperties: false
  properties:
    city: {type: string, description: Ville souhaitée ou vide pour la ville par défaut}
    days: {type: integer, minimum: 1, maximum: 7, description: Nombre de jours, 3 par défaut}
  required: [city, days]
schedule_allowed: true
config:
  DEFAULT_CITY: {label: Ville par défaut, default: Paris}
steps:
  - id: extract
    uses: ai.extract
    with:
      prompt: Extrais city et days. Mets city vide si aucune ville n'est citée et days à 3 si non précisé, maximum 7.
  - id: fetch
    uses: exec.call
    with:
      command: python3
      argv: [main.py]
      arguments: ${{ steps.extract.output }}
      timeout: 20
  - id: respond
    uses: ai.respond
    with:
      data: ${{ steps.fetch.output }}
      prompt: Résume les prévisions avec les dates et températures sans extrapoler.
