id: random.dice
name: Lancer de dés
description: Lance des dés virtuels et renvoie un résultat aléatoire.
routing:
  examples:
    - Lance un dé à six faces
    - Fais deux dés à vingt faces
    - Tire un chiffre de un à dix
    - Lance 3d6 pour moi
inputs:
  type: object
  additionalProperties: false
  properties:
    count: {type: integer, minimum: 1, maximum: 20, description: Nombre de dés à lancer}
    sides: {type: integer, minimum: 2, maximum: 100, description: Nombre de faces par dé}
  required: [count, sides]
schedule_allowed: false
steps:
  - id: extract
    uses: ai.extract
    with:
      prompt: Extrais le nombre de dés et de faces. Par défaut un dé à six faces.
  - id: roll
    uses: exec.call
    with:
      command: python3
      argv: [main.py]
      arguments: ${{ steps.extract.output }}
      timeout: 5
  - id: respond
    uses: core.template
    with:
      data: ${{ steps.roll.output }}
      template: "J'ai lancé les dés. Total : {{ total }}."
