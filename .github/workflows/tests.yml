name: Tests
on:
  push:
  pull_request:

jobs:
  python-services-and-plugins:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies for the remaining Python services
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8,<10' 'numpy>=1.26,<3' 'httpx>=0.27,<1' 'PyYAML>=6,<7' 'fastapi>=0.115,<1' 'python-multipart>=0.0.18'
      - run: pytest -q
      - run: python -m compileall -q services/listener services/stt tools
      - name: Validate administration WebUI script
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("core-rs/web/index.html").read_text(encoding="utf-8")
          Path("/tmp/hestia-webui.js").write_text(text.split("<script>", 1)[1].split("</script>", 1)[0], encoding="utf-8")
          PY
          node --check /tmp/hestia-webui.js

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.rust.yaml config --quiet
      - name: Check single-file Rust deployment and built-in listener
        run: |
          docker compose -f compose.yaml config --format json > /tmp/hestia-compose.json
          python3 - <<'PY'
          import json
          with open("/tmp/hestia-compose.json") as f:
              services = json.load(f)["services"]
          assert services["hestia"]["build"]["dockerfile"] == "docker/Dockerfile.core-rust"
          assert services["hestia"]["healthcheck"]["test"][1] == "curl"
          assert "listener" in services
          assert not services["listener"].get("profiles")
          assert services["stt"]["environment"]["STT_MODEL"] == "base"
          PY

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/up.sh scripts/memory.sh
      - run: ./scripts/up.sh --dry-run
      - run: HESTIA_MEMORY_PROFILE=2g ./scripts/up.sh --dry-run
      - run: HESTIA_MEMORY_PROFILE=8g ./scripts/up.sh --dry-run

  listener-image:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file docker/Dockerfile.listener --tag hestia-listener:ci .
      - name: Smoke-test native RNNoise library
        run: docker run --rm hestia-listener:ci python -c "from listener.dsp import RNNoise; d = RNNoise(); d.close()"
      - name: Smoke-test openWakeWord (no microphone)
        run: docker run --rm hestia-listener:ci python -c "import numpy as np; from listener.wake import WakeDetector; w = WakeDetector('hey jarvis'); w.predict(np.zeros(1280, dtype=np.int16))"

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - name: Rust tests and compilation
        run: cargo test --manifest-path core-rs/Cargo.toml

  rust-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust core image
        run: docker build -f docker/Dockerfile.core-rust -t hestia-rust:ci .
      - name: Check Rust and plugin runtime
        run: |
          docker run --rm hestia-rust:ci --version
          docker run --rm --entrypoint /bin/sh hestia-rust:ci -c 'command -v curl; command -v python3; command -v sh'
