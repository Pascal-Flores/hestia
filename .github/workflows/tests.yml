name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,api]' 'numpy>=1.26,<3'
      - run: pytest -q
      - run: hestia tools
      - run: python -m compileall -q tools

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose --profile listener -f compose.yaml config --quiet
      - run: python -m compileall -q services/listener

  rust-compose-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Validate Rust overlay and healthcheck
        run: |
          docker compose -f compose.yaml -f compose.rust.yaml config --quiet
          docker compose -f compose.yaml -f compose.rust.yaml config --format json > /tmp/hestia-rust-compose.json
          python3 - <<'PY'
          import json
          with open("/tmp/hestia-rust-compose.json", encoding="utf-8") as file:
              config = json.load(file)
          check = config["services"]["hestia"]["healthcheck"]["test"]
          assert check[0:2] == ["CMD", "curl"], check
          assert check[-1] == "http://127.0.0.1:8765/health/live", check
          assert "python" not in check, check
          PY

  native-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/native/*.sh scripts/up.sh scripts/memory.sh
      - run: ./scripts/native/run.sh --dry-run
      - run: HESTIA_MEMORY_PROFILE=2g ./scripts/native/run.sh --dry-run
      - run: HESTIA_MEMORY_PROFILE=8g ./scripts/native/run.sh --dry-run

  listener-image:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file docker/Dockerfile.listener --tag hestia-listener:ci .
      - name: Smoke-test native RNNoise library
        run: docker run --rm hestia-listener:ci python -c "from listener.dsp import RNNoise; d = RNNoise(); d.close()"
      - name: Smoke-test openWakeWord inference (no microphone)
        run: docker run --rm hestia-listener:ci python -c "import numpy as np; from listener.wake import WakeDetector; w = WakeDetector('hey jarvis'); w.predict(np.zeros(1280, dtype=np.int16))"

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - name: Rust tests and compilation
        run: cargo test --manifest-path core-rs/Cargo.toml

  rust-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust core Docker image
        run: docker build -f docker/Dockerfile.core-rust -t hestia-rust:ci .
      - name: Test Rust binary starts in runtime image
        run: docker run --rm hestia-rust:ci --version
