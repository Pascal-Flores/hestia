# Hestia local CPU stack (linux/amd64 and linux/arm64).
# Public port: only Hestia's API. The three model services remain internal.
services:
  hestia:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      HESTIA_TOOLS_DIR: /app/tools
      HESTIA_EMBEDDING_BACKEND: fastembed
      HESTIA_EMBEDDING_MODEL: ${HESTIA_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      HESTIA_EMBEDDING_CACHE: /cache/embeddings
      HESTIA_ROUTE_MIN_SCORE: ${HESTIA_ROUTE_MIN_SCORE:-0.80}
      HESTIA_ROUTE_MIN_MARGIN: ${HESTIA_ROUTE_MIN_MARGIN:-0.035}
      HESTIA_ALLOWED_PERMISSIONS: ${HESTIA_ALLOWED_PERMISSIONS:-}
      HESTIA_API_KEY: ${HESTIA_API_KEY:-}
      HESTIA_LLM_URL: http://llm:8080/v1/chat/completions
      HESTIA_LLM_MODEL: hestia-local
      HESTIA_LLM_TIMEOUT: ${HESTIA_LLM_TIMEOUT:-180}
      HESTIA_FALLBACK_LLM_URL: ${HESTIA_FALLBACK_LLM_URL:-http://llm:8080/v1/chat/completions}
      HESTIA_FALLBACK_LLM_MODEL: ${HESTIA_FALLBACK_LLM_MODEL:-hestia-local}
      HESTIA_FALLBACK_LLM_API_KEY: ${HESTIA_FALLBACK_LLM_API_KEY:-}
      HESTIA_STT_URL: http://stt:8001/v1/transcribe
      HESTIA_TTS_URL: http://tts:8000/tts
      HESTIA_VOICE_PROFILE: ${HESTIA_VOICE_PROFILE:-natural}
      OMP_NUM_THREADS: '2'
    volumes:
      - ./tools:/app/tools:ro
      - embedding_cache:/cache/embeddings
    ports:
      - "${HESTIA_BIND_IP:-127.0.0.1}:${HESTIA_PORT:-8765}:8765"
    depends_on:
      - llm
      - stt
      - tts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/live',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - --hf-repo
      - ${LLM_HF_REPO:-bartowski/Qwen_Qwen3-0.6B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --alias
      - hestia-local
      - --reasoning
      - 'off'
      - --ctx-size
      - ${LLM_CONTEXT:-2048}
      - --threads
      - ${LLM_THREADS:-2}
      - --n-predict
      - ${LLM_MAX_TOKENS:-256}
    environment:
      HF_HOME: /cache/hf
    volumes:
      - llm_cache:/cache/hf
    security_opt:
      - no-new-privileges:true

  stt:
    build:
      context: .
      dockerfile: docker/Dockerfile.stt
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-tiny}
      STT_LANGUAGE: ${STT_LANGUAGE:-fr}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-2}
      HF_HOME: /cache/hf
    volumes:
      - stt_cache:/cache/hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true

  tts:
    build:
      context: .
      dockerfile: docker/Dockerfile.tts
    restart: unless-stopped
    command:
      - pocket-tts
      - serve
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --language
      - ${TTS_LANGUAGE:-french}
      - --default-voice
      - ${TTS_VOICE:-estelle}
    environment:
      HF_HOME: /cache/hf
      OMP_NUM_THREADS: '2'
    volumes:
      - tts_cache:/cache/hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true

volumes:
  llm_cache:
  embedding_cache:
  stt_cache:
  tts_cache:
